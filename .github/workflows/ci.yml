name: .NET CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & test all C# projects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Calculator
        run: |
          cd Calculator
          dotnet build --configuration Release

      - name: Test ProblemSolving
        run: |
          cd ProblemSolving
          dotnet run --configuration Release

      - name: Build NumberGuessing
        run: |
          cd NumberGuessing
          dotnet build --configuration Release

      - name: Build PasswordGenerator
        run: |
          cd PasswordGenerator
          dotnet build --configuration Release
